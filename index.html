<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summariser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <h1>Text Summariser</h1>
        <h3>Using Hugging Face Transformer</h3>

        <form>
            <textarea placeholder="Enter your text..." required id="dialogue_input"></textarea>
            <button type="submit" id="submit">Summarise</button>
        </form>

        <div class="summary_output">
            <h3 id="summary_heading">Content Summary</h3>
            <p id="summary_output"></p>
        </div>

    </div>

    <script>
        document.getElementById("summarization-form").addEventListener("submit", async(e)=>{
            e.preventDefault();

            const dialogueInput = document.getElementById("dialogue_input");
            const summaryText = document.getElementById("summary_output");
            const submitButton = e.target.querySelector("button");

            const dialogue = dialogueInput.value.trim();
            if(!dialogue) return;
            
            summaryText.innerText = "Processin...";
            submitButton.disabled = true;

            try{
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({dialogue}),
                });

                if(!response.ok){
                    throw new Error('Server error: : ${response.status}');
                }

                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";

            } catch (err){
                summaryText.innerText = "Error: ${err.message}";

            }finally{
                submitButton.disabled = False;
            }
        });
    </script>
    
</body>
</html>
